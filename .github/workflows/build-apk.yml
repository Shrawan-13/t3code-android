name: build-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Cache configuration cache
        uses: actions/cache@v4
        with:
          path: android/.gradle/configuration-cache
          key: config-cache-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: |
            config-cache-${{ runner.os }}-

      - name: Restore Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi
          "$SDKMANAGER" --list_installed 2>/dev/null | grep -E 'platforms;android-34|build-tools;34.0.0' || true

      - name: Build
        working-directory: android
        run: |
          gradle --build-cache --configuration-cache --parallel :app:assembleDebug
          ls -lh app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'libt3core.so|classes.dex' | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: t3code-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  prune-caches:
    name: Prune caches (keep newest 20)
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prune old caches
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "20"
        run: ./scripts/prune-caches.sh
